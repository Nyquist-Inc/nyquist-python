[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyquist-sdk"
version = "0.5.0"
description = "Python SDK and `nyq` CLI for Nyquist, the agent research desk for funds: market data, risk, the bull/bear debate and governed quant tools."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nyquist", email = "contact@nyquist.pro" }]
keywords = ["nyquist", "quant", "research", "finance", "risk", "ontology", "cli", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
mcp = ["nyquist-mcp>=0.5,<0.6"]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.2"]

[project.urls]
Homepage = "https://getnyquist.com"

[project.scripts]
nyq = "nyquist.cli:main"

[tool.setuptools.packages.find]
include = ["nyquist*"]

[tool.setuptools.package-data]
nyquist = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated from the platform's metadata layer; its lines follow the source.
extend-exclude = ["nyquist/ontology_types.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
