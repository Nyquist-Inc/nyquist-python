name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e 'sdk[dev]' -e 'mcp[dev]'
      - run: ruff check sdk/nyquist sdk/tests mcp/nyquist_mcp mcp/tests
      # Separate runs: each package has its own pytest rootdir.
      - run: python -m pytest sdk/tests -q
      - run: python -m pytest mcp/tests -q
