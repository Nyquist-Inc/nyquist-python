[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyquist-mcp"
version = "0.5.0"
description = "MCP server for Nyquist: the agent research desk and governed quant tools for Claude, Cursor and any MCP client."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nyquist", email = "contact@nyquist.pro" }]
keywords = ["mcp", "model-context-protocol", "nyquist", "quant", "risk", "finance", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "nyquist-sdk>=0.5,<0.6",
    "mcp>=2.2,<3",
    "mcp-types>=2.2,<3",
    "anyio>=4.5",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.2"]

[project.urls]
Homepage = "https://getnyquist.com"

[project.scripts]
nyquist-mcp = "nyquist_mcp.server:main"

[tool.setuptools.packages.find]
include = ["nyquist_mcp*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
